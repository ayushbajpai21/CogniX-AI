<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Cybernetic Glow Gradients -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Cyber Shield -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

  <!-- Inner High-Tech Energy Grid -->
  <polygon points="50,16 80,33 80,67 50,84 20,67 20,33" stroke="url(#coreGrad)" stroke-width="1.5" stroke-dasharray="4 2" stroke-opacity="0.7" />

  <!-- Central Multi-Agent Neural Nexus (CogniX 'X' Core) -->
  <path d="M34 32 L66 68 M66 32 L34 68" stroke="url(#coreGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <path d="M50 20 L50 40 M50 60 L50 80" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- 4 Autonomous Agent Orbit Nodes -->
  <!-- Scout (North) -->
  <circle cx="50" cy="18" r="4.5" fill="url(#neonCyan)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)" />
  <!-- Scholar (East) -->
  <circle cx="78" cy="50" r="4.5" fill="url(#neonAmber)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)" />
  <!-- Scribe (South) -->
  <circle cx="50" cy="82" r="4.5" fill="url(#neonAmber)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)" />
  <!-- Auditor (West) -->
  <circle cx="22" cy="50" r="4.5" fill="url(#neonCyan)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)" />

  <!-- Inner Quantum Pulse Core -->
  <circle cx="50" cy="50" r="6" fill="#ffffff" filter="url(#glow)" />
</svg>